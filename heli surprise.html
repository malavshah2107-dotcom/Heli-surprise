body>*{position:relative}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(4vh + env(safe-area-inset-top)) 6vw calc(4vh + env(safe-area-inset-bottom));text-align:center;opacity:0;visibility:hidden;transform:scale(1.05);transition:opacity 1.2s,transform 1.2s,visibility 0s 1.2s;overflow-y:auto;overflow-x:hidden;z-index:2}
.sc.on{opacity:1;visibility:visible;transform:none;transition:opacity 1.2s,transform 1.2s}
.sc>:first-child{margin-top:auto}.sc>:last-child{margin-bottom:auto}
h1,h2{font-family:'Dancing Script',cursive;margin:.25em 0;text-shadow:0 0 18px rgba(255,143,177,.75)}
h1{font-size:clamp(2rem,9vw,3.3rem)}h2{font-size:clamp(1.5rem,6.5vw,2.2rem)}
p{margin:.4em 0;line-height:1.5}
.btn{font:700 1.05rem Quicksand,sans-serif;min-height:54px;padding:0 1.7rem;border:0;border-radius:40px;color:#fff;background:linear-gradient(135deg,#ff6fa0,#c74bd6);box-shadow:0 0 24px rgba(255,111,160,.65);cursor:pointer;touch-action:manipulation;margin:1rem 0}
.btn:active{transform:scale(.96)}
.btn:focus-visible,input:focus-visible,#mus:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
input{width:min(78vw,300px);height:56px;border-radius:16px;border:2px solid #ffb3cc;background:rgba(255,255,255,.13);color:#fff;font:700 1.5rem Quicksand;text-align:center;letter-spacing:.45em;margin:.8rem 0}
.shake{animation:sh .5s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#err{min-height:1.6em;color:#ffb3cc}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff55;background:#00000055;color:#fff;font-size:1.3rem;z-index:20;display:none;cursor:pointer}
.bh{position:fixed;bottom:-30px;z-index:1;pointer-events:none;opacity:.35;color:#ff8fb1;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}

/* ---- AUDIO (synthesized, no files needed) ---- */
let AC,master,sfx,muted=false,started=false,nextT=0,bar=0,mT;
const mf=n=>440*Math.pow(2,(n-69)/12);
const CH=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69]];
function note(f,t,d,v,ty){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function sched(){try{const c=CH[bar++%4],e=60/72/2;if(nextT<AC.currentTime)nextT=AC.currentTime+.1;
[0,1,2,3,2,1,2,3].forEach((k,i)=>note(mf(c[k]+(i%4==3?12:0)),nextT+i*e,1.1,.26,'triangle'));
note(mf(c[0]-24),nextT,e*8,.32,'sine');note(mf(c[2]),nextT,e*8,.08,'sine');nextT+=e*8;mT=setTimeout(sched,(nextT-AC.currentTime-.8)*1000)}catch(e){}}
function startMusic(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=CONFIG.volume;
const d=AC.createDelay(),fb=AC.createGain();d.delayTime.value=.38;fb.gain.value=.35;master.connect(d);d.connect(fb);fb.connect(d);d.connect(AC.destination);master.connect(AC.destination);
sfx=AC.createGain();sfx.gain.value=.6;sfx.connect(AC.destination)}
AC.resume&&AC.resume();if(!started){started=true;sched()}$('mus').style.display='block'}catch(e){$('mus').style.display='block';$('mus').textContent='🔇';$('mus').title='Music unavailable'}}
$('mus').onclick=()=>{if(!AC)return;muted=!muted;const t=AC.currentTime;master.gain.setTargetAtTime(muted?0:CONFIG.volume,t,.1);sfx.gain.setTargetAtTime(muted?0:.6,t,.1);$('mus').textContent=muted?'🔇':'🔊';if(!muted)AC.resume&&AC.resume()};
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{document.hidden?AC.suspend():(!muted&&AC.resume())}catch(e){}});
function nz(dur,fq,g,at,ty){if(!AC||muted)return;try{const n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),k=AC.createGain();f.type=ty;f.frequency.value=fq;k.gain.value=g;s.buffer=b;s.connect(f);f.connect(k);k.connect(sfx);s.start(AC.currentTime+at)}catch(e){}}
const boom=()=>{nz(.7,500,2.2,0,'lowpass');nz(.5,3500,.6,.05,'highpass')},crackle=()=>{for(let i=0;i<16;i++)nz(.05,3000,1,Math.random()*1.1,'highpass')};

arrow(){$('hrt').classList.remove('gone');document.querySelectorAll('.pf,.pp').forEach(e=>e.remove());$('shoot').disabled=false;later(aim,80)},
tree(){treeInit()},
letter(){const e=$('env');e.className='env';$('lt').className='lt';$('lt').innerHTML='';$('lp').style.display='';$('nx2').classList.remove('on');
$('lt').innerHTML=CONFIG.letter.split('\n\n').map((t,i)=>`<p style="animation-delay:${1.4+i*1.1}s">${t.replace(/\n/g,'<br>')}</p>`).join('')},
gal(){let i=0;const show=()=>{if(i>=P.length){crackle();return go('fin')}const p=$('pl');$('pi').src=P[i];$('pc').textContent=CONFIG.captions[i]||'';
p.animate([{opacity:0,transform:'scale(.1) rotate(-30deg)'},{opacity:1,transform:`scale(1.05) rotate(${i%2?4:-4}deg)`,offset:.7},{opacity:1,transform:`scale(1) rotate(${i%2?3:-3}deg)`}],{duration:900,fill:'forwards',easing:'ease-out'});spark($('pl'));i++;later(show,2600)};gal.skip=()=>{clearT();show()};show()},
fin(){$('f1').textContent=CONFIG.final1;$('f2').textContent=CONFIG.final2;fwStart()}};
function go(n){clearT();cancelAnimationFrame(raf);fwOn=false;cur=n;document.querySelectorAll('.sc').forEach(s=>s.classList.toggle('on',s.id===n));init[n]()}
const gal={};

/* pass */
function tryPw(){if($('pw').value.trim()===CONFIG.password){startMusic();go('load')}else{$('err').textContent='Oops, not quite! Try your special date 💔';const i=$('pw');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');navigator.vibrate&&navigator.vibrate(80)}}
$('go').onclick=tryPw;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});

/* arrow */
let ang=0;function aim(){const h=$('hrt').getBoundingClientRect(),b=$('ba').getBoundingClientRect();const hx=h.left+h.width/2,hy=h.top+h.height/2,bx=b.left+75,by=b.top+60;ang=Math.atan2(hy-by,hx-bx);$('ba').style.transform=`rotate(${ang}rad)`;return Math.hypot(hx-bx,hy-by)}
addEventListener('resize',()=>{if(cur==='arrow')aim()});
function burst(x,y,n,g){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pp';s.textContent=g[i%g.length];s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);const a=Math.random()*6.28,d=50+Math.random()*90;s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`,opacity:0}],{duration:900+Math.random()*500}).onfinish=()=>s.remove()}}
function spark(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,10,['✨','💖','⭐'])}
$('shoot').onclick=()=>{const b=$('shoot');if(b.disabled)return;b.disabled=true;const d=aim(),a=$('arw');
const run=a.animate([{transform:'translateX(0)'},{transform:'translateX(-18px)',offset:.3},{transform:`translateX(${d-47}px)`}],{duration:1150,fill:'forwards',easing:'ease-in'});
later(()=>{const bs=$('ba').firstElementChild;bs.animate([{transform:'scaleX(1)'},{transform:'scaleX(.85)'},{transform:'scaleX(1)'}],{duration:400})},0);
run.onfinish=()=>{const h=$('hrt').getBoundingClientRect(),x=h.left+h.width/2,y=h.top+h.height/2;$('hrt').classList.add('gone');a.style.opacity=0;boom();burst(x,y,22,['✨','💖','💗','⭐']);
later(()=>go('tree'),1800)}};

/* typing */
function type(el,txt,cb,sp=55){const a=Array.from(txt);let i=0;el.textContent='';(function t(){el.textContent=a.slice(0,++i).join('');i<a.length?later(t,sp):cb&&later(cb,500)})()}

/* tree */
const cv=$('cv'),cx=cv.getContext('2d');let hs=[],cw=300,ch=330,t0=0,GT=5500;
function treeInit(){$('nx1').classList.remove('on');$('wish').textContent='';$('ttl').textContent='';
cw=Math.min(W()*.86,H()*.48,420);ch=cw*1.1;const dp=Math.min(devicePixelRatio||1,2);cv.width=cw*dp;cv.height=ch*dp;cv.style.width=cw+'px';cv.style.height=ch+'px';cx.setTransform(dp,0,0,dp,0,0);
const C=['#ff6b9d','#ff8fb1','#ffb3c6','#e0457b','#c74bd6','#ffd98a','#ff5c8a','#f7a8e0','#fff'],k=cw/40;hs=[];
for(let i=0;i<230;i++){const t=Math.random()*6.283,r=Math.sqrt(.08+Math.random()*.92),x=16*Math.pow(Math.sin(t),3)*r,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r;hs.push({x:cw/2+x*k,y:.4*ch+y*k,s:k*(1.2+Math.random()*.9),c:C[i%C.length],o:y})}
hs.sort((a,b)=>b.o-a.o);hs.forEach((h,i)=>h.st=i/hs.length*GT+Math.random()*350);draw(0);
type($('wish'),CONFIG.wish,()=>type($('ttl'),CONFIG.title,()=>later(()=>{t0=performance.now();raf=requestAnimationFrame(tick)},900),60),80)}
function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.4);cx.bezierCurveTo(x-s*1.2,y-s*.3,x-s*.6,y-s,x,y-s*.4);cx.bezierCurveTo(x+s*.6,y-s,x+s*1.2,y-s*.3,x,y+s*.4);cx.fill()}
function draw(t){cx.clearRect(0,0,cw,ch);cx.strokeStyle='#8a5a44';cx.lineCap='round';cx.lineWidth=cw*.05;cx.beginPath();cx.moveTo(cw/2,ch*.98);cx.quadraticCurveTo(cw*.47,ch*.8,cw/2,ch*.62);cx.stroke();
cx.lineWidth=cw*.025;cx.beginPath();cx.moveTo(cw/2,ch*.68);cx.quadraticCurveTo(cw*.42,ch*.6,cw*.36,ch*.5);cx.moveTo(cw/2,ch*.68);cx.quadraticCurveTo(cw*.58,ch*.6,cw*.64,ch*.5);cx.stroke();
for(const h of hs){const p=Math.min(1,(t-h.st)/500);if(p<=0)continue;const e=p<1?1+Math.sin(p*3.14)*.35:1;cx.fillStyle=h.c;cx.globalAlpha=.95*p;heart(h.x,h.y,h.s*p*e)}cx.globalAlpha=1}
function tick(n){const t=n-t0;draw(t);if(t<GT+900)raf=requestAnimationFrame(tick);else $('nx1').classList.add('on')}
$('nx1').onclick=()=>go('letter');

/* letter */
function openEnv(){const e=$('env');if(e.classList.contains('open'))return;e.classList.add('open');spark(e);$('lp').style.display='none';
later(()=>e.classList.add('away'),900);later(()=>{e.classList.add('hid');$('lt').classList.add('on');spark($('lt'))},2200);later(()=>$('nx2').classList.add('on'),2200+1400+CONFIG.letter.split('\n\n').length*1100)}
$('env').onclick=openEnv;$('env').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv()}};
$('nx2').onclick=()=>go('gal');$('pl').onclick=()=>gal.skip&&gal.skip();

/* final fireworks + confetti (looping) */
const fc=$('fw'),fx=fc.getContext('2d');let R=[],Pt=[],Cf=[],lastL=0,FW=0,FH=0;
function fwStart(){const dp=Math.min(devicePixelRatio||1,1.5);FW=W();FH=H();fc.width=FW*dp;fc.height=FH*dp;fx.setTransform(dp,0,0,dp,0,0);R=[];Pt=[];
Cf=Array.from({length:40},()=>({x:Math.random()*FW,y:Math.random()*FH,v:1+Math.random()*1.5,w:4+Math.random()*4,c:`hsl(${Math.random()*360},90%,70%)`,r:Math.random()*6}));
if(!$('bl0')){for(let i=0;i<6;i++){const b=document.createElement('div');b.className='bl';b.id='bl'+i;b.style.cssText=`left:${5+i*17}%;background:hsl(${330+i*22},85%,68%);animation-delay:${-i*1.6}s;animation-duration:${8+i}s;display:none`;document.body.appendChild(b)}}
document.querySelectorAll('.bl').forEach(b=>b.style.display='block');fwOn=true;lastL=0;raf=requestAnimationFrame(fwLoop)}
function fwLoop(t){if(!fwOn)return;fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.2)';fx.fillRect(0,0,FW,FH);fx.globalCompositeOperation='lighter';
if(t-lastL>1000&&R.length<3){lastL=t;R.push({x:FW*(.15+Math.random()*.7),y:FH,ty:FH*(.12+Math.random()*.3),h:Math.random()*360})}
R=R.filter(r=>{r.y-=Math.min(9,FH/70);fx.fillStyle='#fff';fx.fillRect(r.x,r.y,2,6);if(r.y<=r.ty){boom();for(let i=0;i<34;i++){const a=i/34*6.283,v=1.5+Math.random()*2.2;Pt.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:`hsl(${r.h+Math.random()*40},100%,65%)`})}return false}return true});
Pt=Pt.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.985;p.l-=.013;fx.globalAlpha=Math.max(p.l,0);fx.fillStyle=p.c;fx.fillRect(p.x,p.y,2.5,2.5);return p.l>0});fx.globalAlpha=.85;
for(const c of Cf){c.y+=c.v;c.r+=.05;if(c.y>FH){c.y=-10;c.x=Math.random()*FW}fx.fillStyle=c.c;fx.fillRect(c.x+Math.sin(c.r)*8,c.y,c.w,c.w*.6)}fx.globalAlpha=1;raf=requestAnimationFrame(fwLoop)}
$('rp').onclick=()=>{document.querySelectorAll('.bl,.pf,.pp').forEach(e=>e.style.display='none');$('arw').getAnimations().forEach(a=>a.cancel());$('arw').style.opacity=1;go('pass')};
addEventListener('pagehide',()=>{fwOn=false;cancelAnimationFrame(raf)});
</script></body></html>
